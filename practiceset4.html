<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
        color: white;
    }

    #nav {
        height: 60px;
        background-color: #0f1111;
    }

    .one {
        background-color: brown;
        height: 100px;
        width: 100px;
        border-radius: 50%;
    }

    button {
        background-color: #f08804;
    }

    #logo {

        color: #f08804;
        font-size: 25px;
        padding: 12px;
    }

    a {
        margin-right: 200px;
        text-decoration: none;
    }

    .contentbox {
        height: 100px;
        width: 100px;
        border: 2px solid black;
    }

    footer {
        background-color: #0f1111;
        color: white;
        text-align: center;
    }

    #content {
        height: 555px;
    }
</style>

<body>
    <header>
        <div id="nav">
            <a id="logo" href="#">amazon.in</a>
            <a href="#">Account</a>
            <a href="#">My cart</a>
            <a href="#">Contact Us</a>
            <input placeholder="search Amazon.in">
            <button>Search</button>
        </div>
    </header>
    <div id="content">
        <div class="contentbox" style="background-color: red;">Buy your favoraite laptop</div>
        <div class="contentbox" style="background-color: green;">Buy your favoraite Gadgets</div>
        <div class="contentbox" style="background-color: blue;">Buy your favoraite Mobile Phones</div>
    </div>
    <footer style="color: #ffffff;">&copy;1996-2023, Amazon.com, Inc, or its affiliates</footer>
</body>

</html>
