<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 100px;
            width: 100px;
            background-color: aqua;
            border: 2px solid black;
            display: inline-block;
        }

        #box1 {
            position: static;

        }

        #box2 {
            position: relative;
            top: 20px;
            left: 10px;
            z-index: 1;
        }

        #box3 {
            position: absolute;
            top: 500;
            left: 20px;
        }

        #box4 {
            position: fixed;
            top: 50;
            z-index: 3;
            background-image: url("https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Imran_Khan_Prime_Minister_03.jpg/250px-Imran_Khan_Prime_Minister_03.jpg");
            background-size: cover;
        }
    </style>
</head>

<body>
    <h1>Position PlayGround</h1>
    <div id="box1">Box1</div>
    <div id="box2">Box2</div>
    <div id="box3">Box3</div>
    <div id="box4">Box4</div>

</body>

</html>
